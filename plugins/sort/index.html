<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>排序算法可视化</title>
  <style>
    :root {
      --bg-primary: #ffffff;
      --bg-secondary: #f7f8fa;
      --bg-tertiary: #eef0f4;
      --border-color: #e8eaed;
      --text-primary: #111827;
      --text-secondary: #6b7280;
      --accent-color: #2563eb;
      --success-color: #10b981;
    }

    [data-theme="dark"] {
      --bg-primary: #1a1a1f;
      --bg-secondary: #141418;
      --bg-tertiary: #22222a;
      --border-color: #2e2e38;
      --text-primary: #e8e8ed;
      --text-secondary: #9a9aaa;
      --accent-color: #4a9eff;
      --success-color: #34d399;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 8px;
      background: transparent;
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    }

    .sort-visualizer {
      padding: 16px;
      background: var(--bg-secondary);
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .visualizer-controls {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .control-btn {
      padding: 6px 12px;
      font-size: 13px;
      border: 1px solid var(--border-color);
      background: var(--bg-primary);
      color: var(--text-primary);
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .control-btn:hover {
      background: var(--bg-tertiary);
      border-color: var(--accent-color);
    }

    .control-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .step-info {
      margin-left: auto;
      font-size: 12px;
      color: var(--text-secondary);
      font-family: SFMono-Regular, Consolas, monospace;
    }

    .visualizer-container {
      display: flex;
      align-items: flex-end;
      gap: 4px;
      height: 200px;
      padding: 12px;
      background: var(--bg-tertiary);
      border-radius: 6px;
    }

    .bar {
      flex: 1;
      min-width: 20px;
      max-width: 60px;
      background: var(--accent-color);
      border-radius: 4px 4px 0 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      padding-top: 8px;
      transition: height 0.15s, background-color 0.15s, transform 0.15s;
      position: relative;
    }

    .bar.comparing {
      background: #f59e0b;
      transform: scaleY(1.02);
    }

    .bar.swapping {
      background: #ef4444;
      transform: scaleY(1.05);
    }

    .bar.sorted {
      background: var(--success-color);
    }

    .bar-value {
      font-size: 11px;
      font-weight: 600;
      color: #fff;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
      position: absolute;
      top: 4px;
    }

    .visualizer-description {
      margin-top: 12px;
      padding: 8px 12px;
      background: var(--bg-tertiary);
      border-radius: 4px;
      font-size: 13px;
      color: var(--text-secondary);
    }

    .visualizer-info {
      display: flex;
      gap: 16px;
      margin-top: 12px;
      font-size: 12px;
      color: var(--text-secondary);
      flex-wrap: wrap;
    }
  </style>
</head>
<body>
  <div class="sort-visualizer">
    <div class="visualizer-controls">
      <button id="btnPlay" class="control-btn">▶ 播放</button>
      <button id="btnStep" class="control-btn">⏭ 单步</button>
      <button id="btnReset" class="control-btn">↺ 重置</button>
      <span class="step-info" id="stepInfo">步骤: 0 / 0</span>
    </div>
    <div class="visualizer-container" id="bars"></div>
    <div class="visualizer-description" id="description" style="display:none"></div>
    <div class="visualizer-info">
      <span id="algoInfo"></span>
      <span id="arrayInfo"></span>
    </div>
  </div>

  <script>
    const args = PluginRuntime.getResolvedArgs ? PluginRuntime.getResolvedArgs() : {
      array: [5, 2, 8, 1, 9, 3, 7, 4, 6],
      algorithm: 'bubble',
      speed: 300,
      showSteps: true,
      ...(PluginRuntime.args || {})
    };

    const inputArray = Array.isArray(args.array) && args.array.length
      ? args.array.slice()
      : [5, 2, 8, 1, 9, 3, 7, 4, 6];
    const algorithm = args.algorithm || 'bubble';
    const speed = typeof args.speed === 'number' ? args.speed : 300;
    const showSteps = args.showSteps !== false;

    // ============================================
    // 排序算法实现（生成器）
    // ============================================

    function* bubbleSort(arr) {
      const a = [...arr];
      const n = a.length;
      const sorted = [];
      for (let i = 0; i < n - 1; i++) {
        for (let j = 0; j < n - i - 1; j++) {
          yield { array: [...a], comparing: [j, j + 1], sorted: [...sorted] };
          if (a[j] > a[j + 1]) {
            yield { array: [...a], swapping: [j, j + 1], sorted: [...sorted], description: `交换 ${a[j]} 和 ${a[j + 1]}` };
            [a[j], a[j + 1]] = [a[j + 1], a[j]];
          }
        }
        sorted.unshift(n - i - 1);
      }
      sorted.unshift(0);
      yield { array: [...a], sorted, description: '排序完成' };
    }

    function* quickSort(arr) {
      const a = [...arr];
      function partition(low, high) {
        const pivot = a[high];
        let i = low - 1;
        for (let j = low; j < high; j++) {
          if (a[j] < pivot) {
            i++;
            [a[i], a[j]] = [a[j], a[i]];
          }
        }
        [a[i + 1], a[high]] = [a[high], a[i + 1]];
        return i + 1;
      }
      function* sort(low, high) {
        if (low < high) {
          yield { array: [...a], comparing: [low, high], description: `分区 [${low}, ${high}]` };
          const pi = partition(low, high);
          yield { array: [...a], sorted: [pi], description: `基准点 ${a[pi]} 就位` };
          yield* sort(low, pi - 1);
          yield* sort(pi + 1, high);
        } else if (low === high) {
          yield { array: [...a], sorted: [low], description: `元素 ${a[low]} 已就位` };
        }
      }
      yield* sort(0, a.length - 1);
      yield { array: [...a], sorted: a.map((_, i) => i), description: '排序完成' };
    }

    function* insertionSort(arr) {
      const a = [...arr];
      const sorted = [0];
      for (let i = 1; i < a.length; i++) {
        const key = a[i];
        let j = i - 1;
        yield { array: [...a], comparing: [i, i], sorted: [...sorted], description: `选择元素 ${key}` };
        while (j >= 0 && a[j] > key) {
          yield { array: [...a], comparing: [j, j + 1], sorted: [...sorted] };
          a[j + 1] = a[j];
          yield { array: [...a], swapping: [j, j + 1], sorted: [...sorted], description: `移动 ${a[j]}` };
          j--;
        }
        a[j + 1] = key;
        sorted.push(i);
        sorted.sort((x, y) => x - y);
      }
      yield { array: [...a], sorted: a.map((_, i) => i), description: '排序完成' };
    }

    function* selectionSort(arr) {
      const a = [...arr];
      const sorted = [];
      for (let i = 0; i < a.length; i++) {
        let minIdx = i;
        for (let j = i + 1; j < a.length; j++) {
          yield { array: [...a], comparing: [minIdx, j], sorted: [...sorted] };
          if (a[j] < a[minIdx]) minIdx = j;
        }
        if (minIdx !== i) {
          yield { array: [...a], swapping: [i, minIdx], sorted: [...sorted], description: `交换 ${a[i]} 和 ${a[minIdx]}` };
          [a[i], a[minIdx]] = [a[minIdx], a[i]];
        }
        sorted.push(i);
      }
      yield { array: [...a], sorted, description: '排序完成' };
    }

    function* mergeSort(arr) {
      const a = [...arr];
      function* merge(l, m, r) {
        const left = a.slice(l, m + 1);
        const right = a.slice(m + 1, r + 1);
        let i = 0, j = 0, k = l;
        while (i < left.length && j < right.length) {
          yield { array: [...a], comparing: [l + i, m + 1 + j], description: `比较 ${left[i]} 和 ${right[j]}` };
          if (left[i] <= right[j]) { a[k] = left[i]; i++; } else { a[k] = right[j]; j++; }
          yield { array: [...a], swapping: [k, k], description: '归并元素' };
          k++;
        }
        while (i < left.length) { a[k] = left[i]; yield { array: [...a], swapping: [k, k] }; i++; k++; }
        while (j < right.length) { a[k] = right[j]; yield { array: [...a], swapping: [k, k] }; j++; k++; }
      }
      function* sort(l, r) {
        if (l < r) {
          const m = Math.floor((l + r) / 2);
          yield* sort(l, m);
          yield* sort(m + 1, r);
          yield* merge(l, m, r);
        }
      }
      yield* sort(0, a.length - 1);
      yield { array: [...a], sorted: a.map((_, i) => i), description: '排序完成' };
    }

    function getAlgorithm(name) {
      switch (name) {
        case 'quick': return quickSort;
        case 'merge': return mergeSort;
        case 'insertion': return insertionSort;
        case 'selection': return selectionSort;
        default: return bubbleSort;
      }
    }

    function collectSteps(gen) {
      const steps = [];
      let result = gen.next();
      while (!result.done) {
        steps.push(result.value);
        result = gen.next();
      }
      return steps;
    }

    // ============================================
    // 状态与渲染
    // ============================================

    const barsEl = document.getElementById('bars');
    const stepInfoEl = document.getElementById('stepInfo');
    const descEl = document.getElementById('description');
    const algoInfoEl = document.getElementById('algoInfo');
    const arrayInfoEl = document.getElementById('arrayInfo');
    const btnPlay = document.getElementById('btnPlay');
    const btnStep = document.getElementById('btnStep');
    const btnReset = document.getElementById('btnReset');

    const steps = collectSteps(getAlgorithm(algorithm)(inputArray));
    let currentStep = 0;
    let isPlaying = false;
    let timer = null;
    let currentState = {
      array: inputArray.slice(),
      comparing: null,
      swapping: null,
      sorted: [],
      description: '',
    };

    const maxValue = Math.max(...inputArray, 1);

    function render() {
      const { array = inputArray, comparing = null, swapping = null, sorted = [], description = '' } = currentState;
      barsEl.innerHTML = '';
      array.forEach((value, idx) => {
        const bar = document.createElement('div');
        const classes = ['bar'];
        if (comparing && comparing.includes(idx)) classes.push('comparing');
        if (swapping && swapping.includes(idx)) classes.push('swapping');
        if (sorted.includes(idx)) classes.push('sorted');
        bar.className = classes.join(' ');
        bar.style.height = `${(value / maxValue) * 100}%`;
        const span = document.createElement('span');
        span.className = 'bar-value';
        span.textContent = value;
        bar.appendChild(span);
        barsEl.appendChild(bar);
      });

      stepInfoEl.textContent = `步骤: ${currentStep} / ${steps.length}`;

      if (showSteps && description) {
        descEl.style.display = '';
        descEl.textContent = description;
      } else {
        descEl.style.display = 'none';
      }
    }

    function notify(status) {
      if (PluginRuntime.updateState) {
        PluginRuntime.updateState({ status, currentStep, totalSteps: steps.length });
      }
    }

    function step() {
      if (currentStep >= steps.length) return;
      const stepData = steps[currentStep];
      currentState = {
        array: inputArray.slice(),
        comparing: null,
        swapping: null,
        sorted: [],
        description: '',
        ...stepData,
      };
      currentStep++;
      render();
      if (currentStep >= steps.length) {
        stopPlay();
        notify('completed');
      } else {
        notify(isPlaying ? 'playing' : 'paused');
      }
    }

    function startPlay() {
      if (isPlaying) return;
      if (currentStep >= steps.length) reset();
      isPlaying = true;
      btnPlay.textContent = '⏸ 暂停';
      loop();
      notify('playing');
    }

    function loop() {
      if (!isPlaying) return;
      timer = setTimeout(() => {
        if (!isPlaying) return;
        step();
        if (currentStep < steps.length) loop();
      }, speed);
    }

    function stopPlay() {
      isPlaying = false;
      if (timer) { clearTimeout(timer); timer = null; }
      btnPlay.textContent = '▶ 播放';
    }

    function reset() {
      stopPlay();
      currentStep = 0;
      currentState = { array: inputArray.slice(), comparing: null, swapping: null, sorted: [], description: '' };
      render();
      notify('idle');
    }

    btnPlay.addEventListener('click', () => {
      if (isPlaying) {
        stopPlay();
        notify('paused');
      } else {
        startPlay();
      }
    });

    btnStep.addEventListener('click', () => {
      if (isPlaying) return;
      step();
    });

    btnReset.addEventListener('click', reset);

    algoInfoEl.textContent = `算法: ${algorithm}`;
    arrayInfoEl.textContent = `数组: [${inputArray.join(', ')}]`;

    // 参数变化时宿主会重新注入 iframe，无需额外处理
    window.onArgsUpdate = function () {};

    render();
    notify('idle');
  </script>
</body>
</html>
