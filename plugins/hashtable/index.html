<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>哈希表可视化</title>
  <style>
    :root { --bg-primary:#ffffff; --bg-secondary:#f7f8fa; --bg-tertiary:#eef0f4; --border-color:#e8eaed; --border-color-strong:#d1d5db; --text-primary:#111827; --text-secondary:#6b7280; --accent-color:#2563eb; --accent-hover:#1d4ed8; --bg-input:#f5f6f8; --success-color:#10b981; }
    [data-theme="dark"] { --bg-primary:#1a1a1f; --bg-secondary:#141418; --bg-tertiary:#22222a; --border-color:#2e2e38; --border-color-strong:#3e3e4a; --text-primary:#e8e8ed; --text-secondary:#9a9aaa; --accent-color:#4a9eff; --accent-hover:#3b8bdb; --bg-input:#2a2a32; --success-color:#34d399; }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 8px;
      background: transparent;
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    }

    .hashtable-visualizer {
      padding: 16px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      margin: 12px 0;
    }

    .visualizer-controls {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .control-btn {
      padding: 6px 12px;
      font-size: 13px;
      border: 1px solid var(--border-color);
      background: var(--bg-input);
      color: var(--text-primary);
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .control-btn:hover {
      background: var(--bg-tertiary);
      border-color: var(--accent-color);
    }

    .control-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .step-info {
      margin-left: auto;
      font-size: 12px;
      color: var(--text-secondary);
      font-family: SFMono-Regular, Consolas, monospace;
    }

    .hashtable-info-bar {
      display: flex;
      gap: 16px;
      margin-bottom: 12px;
      padding: 8px 12px;
      background: var(--bg-tertiary);
      border-radius: 6px;
      font-size: 12px;
      flex-wrap: wrap;
    }

    .hashtable-info-bar span {
      color: var(--text-secondary);
    }

    .hashtable-info-bar strong {
      color: var(--accent-color);
    }

    .hashtable-container {
      padding: 12px;
      background: var(--bg-tertiary);
      border-radius: 6px;
      overflow-x: auto;
    }

    .hashtable-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 8px;
    }

    .hashtable-bucket {
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 8px;
      min-height: 60px;
      transition: all 0.2s;
    }

    .hashtable-bucket.occupied {
      background: var(--bg-primary);
    }

    .hashtable-bucket.highlighted {
      border-color: var(--accent-color);
      box-shadow: 0 0 8px rgba(37, 99, 235, 0.3);
    }

    .bucket-index {
      font-size: 10px;
      color: var(--text-secondary);
      margin-bottom: 4px;
      text-align: center;
    }

    .bucket-items {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .bucket-empty {
      font-size: 11px;
      color: var(--text-secondary);
      text-align: center;
      padding: 4px;
    }

    .bucket-item {
      display: flex;
      flex-wrap: wrap;
      gap: 2px;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      justify-content: center;
    }

    .item-key {
      font-weight: 600;
      color: var(--text-primary);
    }

    .item-value {
      color: var(--text-secondary);
    }

    .visualizer-description {
      margin-top: 12px;
      padding: 8px 12px;
      background: var(--bg-tertiary);
      border-radius: 4px;
      font-size: 13px;
      color: var(--text-secondary);
    }

    .visualizer-info {
      display: flex;
      gap: 16px;
      margin-top: 12px;
      font-size: 12px;
      color: var(--text-secondary);
      flex-wrap: wrap;
    }
  </style>
</head>
<body>
  <div class="hashtable-visualizer">
    <!-- 控制栏 -->
    <div class="visualizer-controls">
      <button id="btnInsert" class="control-btn">➕ 插入</button>
      <button id="btnSearch" class="control-btn">🔍 搜索</button>
      <button id="btnPlay" class="control-btn">▶ 播放</button>
      <button id="btnStep" class="control-btn">⏭ 单步</button>
      <button id="btnReset" class="control-btn">↺ 重置</button>
      <span class="step-info" id="stepInfo">步骤: 0 / 0</span>
    </div>

    <!-- 信息栏 -->
    <div class="hashtable-info-bar">
      <span id="infoKey" style="display:none">当前键: <strong id="infoKeyVal"></strong></span>
      <span id="infoHash" style="display:none">哈希值: <strong id="infoHashVal"></strong></span>
      <span id="infoProbe" style="display:none">探测序列: <span id="infoProbeVal"></span></span>
      <span>负载因子: <strong id="infoLoad">0.00</strong></span>
    </div>

    <!-- 哈希表可视化 -->
    <div class="hashtable-container">
      <div class="hashtable-grid" id="grid"></div>
    </div>

    <!-- 描述 -->
    <div class="visualizer-description" id="description" style="display:none"></div>

    <!-- 方法信息 -->
    <div class="visualizer-info">
      <span id="infoMethod"></span>
      <span id="infoCapacity"></span>
      <span id="infoCount"></span>
    </div>
  </div>

  <script>
    // ============================================
    // 参数解析（使用 getResolvedArgs 获得带默认值的参数）
    // ============================================

    const args = PluginRuntime.getResolvedArgs ? PluginRuntime.getResolvedArgs() : {
      method: 'chaining',
      size: 8,
      items: [
        { key: 'apple', value: 5 },
        { key: 'banana', value: 8 },
        { key: 'cherry', value: 3 },
        { key: 'date', value: 7 }
      ],
      speed: 600,
      ...(PluginRuntime.args || {})
    };

    const method = args.method || 'chaining';
    const size = (typeof args.size === 'number' && args.size > 0) ? Math.floor(args.size) : 8;
    const items = Array.isArray(args.items) ? args.items.slice() : [
      { key: 'apple', value: 5 },
      { key: 'banana', value: 8 },
      { key: 'cherry', value: 3 },
      { key: 'date', value: 7 }
    ];
    const insertKey = args.insertKey;
    const insertValue = args.insertValue;
    const searchKey = args.searchKey;
    const speed = typeof args.speed === 'number' ? args.speed : 600;

    // ============================================
    // 哈希函数
    // ============================================

    function hashFunction(key, size) {
      let hash = 0;
      for (let i = 0; i < key.length; i++) {
        const char = key.charCodeAt(i);
        hash = ((hash << 5) - hash) + char;
        hash = hash & hash; // Convert to 32bit integer
      }
      return Math.abs(hash) % size;
    }

    // ============================================
    // 哈希表操作生成器
    // ============================================

    function createEmptyBuckets(size) {
      return Array.from({ length: size }, (_, i) => ({
        index: i,
        items: [],
      }));
    }

    function cloneBuckets(buckets) {
      return buckets.map(b => ({
        index: b.index,
        items: b.items.map(item => ({ ...item })),
        highlight: b.highlight,
      }));
    }

    function calculateLoadFactor(buckets) {
      const totalItems = buckets.reduce((sum, b) => sum + b.items.length, 0);
      return totalItems / buckets.length;
    }

    // 链地址法插入
    function* insertChaining(buckets, key, value) {
      const size = buckets.length;
      const hash = hashFunction(key, size);

      yield {
        buckets: cloneBuckets(buckets),
        currentKey: key,
        currentValue: value,
        hashValue: hash,
        probeSequence: [hash],
        description: `计算哈希值: hash("${key}") = ${hash}`,
        operation: 'insert',
        loadFactor: calculateLoadFactor(buckets),
      };

      const bucket = buckets[hash];

      // 检查是否已存在
      for (let i = 0; i < bucket.items.length; i++) {
        bucket.items[i].highlight = 'comparing';
        yield {
          buckets: cloneBuckets(buckets),
          currentKey: key,
          currentValue: value,
          hashValue: hash,
          probeSequence: [hash],
          description: `检查位置 ${hash} 的第 ${i + 1} 个元素: ${bucket.items[i].key}`,
          operation: 'insert',
          loadFactor: calculateLoadFactor(buckets),
        };
        bucket.items[i].highlight = undefined;

        if (bucket.items[i].key === key) {
          bucket.items[i].value = value;
          bucket.items[i].highlight = 'found';
          yield {
            buckets: cloneBuckets(buckets),
            currentKey: key,
            currentValue: value,
            hashValue: hash,
            probeSequence: [hash],
            description: `键 "${key}" 已存在，更新值为 ${value}`,
            operation: 'insert',
            loadFactor: calculateLoadFactor(buckets),
          };
          bucket.items[i].highlight = undefined;
          return;
        }
      }

      // 插入新元素
      bucket.items.push({ key, value, highlight: 'found' });
      bucket.highlight = 'current';

      yield {
        buckets: cloneBuckets(buckets),
        currentKey: key,
        currentValue: value,
        hashValue: hash,
        probeSequence: [hash],
        description: `插入键值对 ("${key}", ${value}) 到桶 ${hash}`,
        operation: 'insert',
        loadFactor: calculateLoadFactor(buckets),
      };

      bucket.items[bucket.items.length - 1].highlight = undefined;
      bucket.highlight = undefined;
    }

    // 开放寻址法插入（线性探测）
    function* insertLinear(buckets, key, value) {
      const size = buckets.length;
      const hash = hashFunction(key, size);
      const probeSequence = [];

      yield {
        buckets: cloneBuckets(buckets),
        currentKey: key,
        currentValue: value,
        hashValue: hash,
        probeSequence: [],
        description: `计算哈希值: hash("${key}") = ${hash}`,
        operation: 'insert',
        loadFactor: calculateLoadFactor(buckets),
      };

      let index = hash;
      let probes = 0;

      while (probes < size) {
        probeSequence.push(index);
        const bucket = buckets[index];

        bucket.highlight = 'probing';
        yield {
          buckets: cloneBuckets(buckets),
          currentKey: key,
          currentValue: value,
          hashValue: hash,
          probeSequence: [...probeSequence],
          description: `探测位置 ${index}`,
          operation: 'insert',
          loadFactor: calculateLoadFactor(buckets),
        };

        if (bucket.items.length === 0) {
          // 空位，插入
          bucket.items.push({ key, value, highlight: 'found' });
          bucket.highlight = 'current';

          yield {
            buckets: cloneBuckets(buckets),
            currentKey: key,
            currentValue: value,
            hashValue: hash,
            probeSequence: [...probeSequence],
            description: `在位置 ${index} 插入 ("${key}", ${value})`,
            operation: 'insert',
            loadFactor: calculateLoadFactor(buckets),
          };

          bucket.items[0].highlight = undefined;
          bucket.highlight = undefined;
          return;
        } else if (bucket.items[0].key === key) {
          // 已存在，更新
          bucket.items[0].highlight = 'found';
          bucket.items[0].value = value;

          yield {
            buckets: cloneBuckets(buckets),
            currentKey: key,
            currentValue: value,
            hashValue: hash,
            probeSequence: [...probeSequence],
            description: `键 "${key}" 已存在，更新值为 ${value}`,
            operation: 'insert',
            loadFactor: calculateLoadFactor(buckets),
          };

          bucket.items[0].highlight = undefined;
          bucket.highlight = undefined;
          return;
        }

        // 冲突
        bucket.items[0].highlight = 'collision';
        yield {
          buckets: cloneBuckets(buckets),
          currentKey: key,
          currentValue: value,
          hashValue: hash,
          probeSequence: [...probeSequence],
          description: `位置 ${index} 冲突（已存在 "${bucket.items[0].key}"），继续探测`,
          operation: 'insert',
          loadFactor: calculateLoadFactor(buckets),
        };
        bucket.items[0].highlight = undefined;
        bucket.highlight = undefined;

        index = (index + 1) % size;
        probes++;
      }

      yield {
        buckets: cloneBuckets(buckets),
        currentKey: key,
        currentValue: value,
        hashValue: hash,
        probeSequence: probeSequence,
        description: `哈希表已满，无法插入`,
        operation: 'insert',
        loadFactor: calculateLoadFactor(buckets),
      };
    }

    // 开放寻址法插入（二次探测）
    function* insertQuadratic(buckets, key, value) {
      const size = buckets.length;
      const hash = hashFunction(key, size);
      const probeSequence = [];

      yield {
        buckets: cloneBuckets(buckets),
        currentKey: key,
        currentValue: value,
        hashValue: hash,
        probeSequence: [],
        description: `计算哈希值: hash("${key}") = ${hash}`,
        operation: 'insert',
        loadFactor: calculateLoadFactor(buckets),
      };

      let probes = 0;
      const visited = new Set();

      while (probes < size) {
        // 二次探测: (hash + i^2) % size
        const index = (hash + probes * probes) % size;

        if (visited.has(index)) {
          probes++;
          continue;
        }
        visited.add(index);

        probeSequence.push(index);
        const bucket = buckets[index];

        bucket.highlight = 'probing';
        yield {
          buckets: cloneBuckets(buckets),
          currentKey: key,
          currentValue: value,
          hashValue: hash,
          probeSequence: [...probeSequence],
          description: `探测位置 ${index} (i = ${probes}, i² = ${probes * probes})`,
          operation: 'insert',
          loadFactor: calculateLoadFactor(buckets),
        };

        if (bucket.items.length === 0) {
          bucket.items.push({ key, value, highlight: 'found' });
          bucket.highlight = 'current';

          yield {
            buckets: cloneBuckets(buckets),
            currentKey: key,
            currentValue: value,
            hashValue: hash,
            probeSequence: [...probeSequence],
            description: `在位置 ${index} 插入 ("${key}", ${value})`,
            operation: 'insert',
            loadFactor: calculateLoadFactor(buckets),
          };

          bucket.items[0].highlight = undefined;
          bucket.highlight = undefined;
          return;
        } else if (bucket.items[0].key === key) {
          bucket.items[0].highlight = 'found';
          bucket.items[0].value = value;

          yield {
            buckets: cloneBuckets(buckets),
            currentKey: key,
            currentValue: value,
            hashValue: hash,
            probeSequence: [...probeSequence],
            description: `键 "${key}" 已存在，更新值为 ${value}`,
            operation: 'insert',
            loadFactor: calculateLoadFactor(buckets),
          };

          bucket.items[0].highlight = undefined;
          bucket.highlight = undefined;
          return;
        }

        bucket.items[0].highlight = 'collision';
        yield {
          buckets: cloneBuckets(buckets),
          currentKey: key,
          currentValue: value,
          hashValue: hash,
          probeSequence: [...probeSequence],
          description: `位置 ${index} 冲突，继续探测`,
          operation: 'insert',
          loadFactor: calculateLoadFactor(buckets),
        };
        bucket.items[0].highlight = undefined;
        bucket.highlight = undefined;

        probes++;
      }

      yield {
        buckets: cloneBuckets(buckets),
        currentKey: key,
        currentValue: value,
        hashValue: hash,
        probeSequence: probeSequence,
        description: `哈希表已满或探测失败`,
        operation: 'insert',
        loadFactor: calculateLoadFactor(buckets),
      };
    }

    // 搜索
    function* searchHash(buckets, key, method) {
      const size = buckets.length;
      const hash = hashFunction(key, size);
      const probeSequence = [];

      yield {
        buckets: cloneBuckets(buckets),
        currentKey: key,
        currentValue: null,
        hashValue: hash,
        probeSequence: [],
        description: `搜索键 "${key}"，哈希值 = ${hash}`,
        operation: 'search',
        loadFactor: calculateLoadFactor(buckets),
      };

      if (method === 'chaining') {
        const bucket = buckets[hash];

        for (let i = 0; i < bucket.items.length; i++) {
          bucket.items[i].highlight = 'comparing';
          yield {
            buckets: cloneBuckets(buckets),
            currentKey: key,
            currentValue: null,
            hashValue: hash,
            probeSequence: [hash],
            description: `检查桶 ${hash} 的第 ${i + 1} 个元素: ${bucket.items[i].key}`,
            operation: 'search',
            loadFactor: calculateLoadFactor(buckets),
          };

          if (bucket.items[i].key === key) {
            bucket.items[i].highlight = 'found';
            yield {
              buckets: cloneBuckets(buckets),
              currentKey: key,
              currentValue: bucket.items[i].value,
              hashValue: hash,
              probeSequence: [hash],
              description: `找到键 "${key}"，值 = ${bucket.items[i].value}`,
              operation: 'search',
              loadFactor: calculateLoadFactor(buckets),
            };
            bucket.items[i].highlight = undefined;
            return;
          }
          bucket.items[i].highlight = undefined;
        }

        yield {
          buckets: cloneBuckets(buckets),
          currentKey: key,
          currentValue: null,
          hashValue: hash,
          probeSequence: [hash],
          description: `未找到键 "${key}"`,
          operation: 'search',
          loadFactor: calculateLoadFactor(buckets),
        };
      } else {
        // 开放寻址法
        let index = hash;
        let probes = 0;
        const visited = new Set();

        while (probes < size) {
          if (method === 'linear') {
            index = (hash + probes) % size;
          } else {
            index = (hash + probes * probes) % size;
          }

          if (visited.has(index)) {
            probes++;
            continue;
          }
          visited.add(index);

          probeSequence.push(index);
          const bucket = buckets[index];

          bucket.highlight = 'probing';
          yield {
            buckets: cloneBuckets(buckets),
            currentKey: key,
            currentValue: null,
            hashValue: hash,
            probeSequence: [...probeSequence],
            description: `探测位置 ${index}`,
            operation: 'search',
            loadFactor: calculateLoadFactor(buckets),
          };

          if (bucket.items.length === 0) {
            yield {
              buckets: cloneBuckets(buckets),
              currentKey: key,
              currentValue: null,
              hashValue: hash,
              probeSequence: [...probeSequence],
              description: `位置 ${index} 为空，未找到键 "${key}"`,
              operation: 'search',
              loadFactor: calculateLoadFactor(buckets),
            };
            bucket.highlight = undefined;
            return;
          }

          bucket.items[0].highlight = 'comparing';
          yield {
            buckets: cloneBuckets(buckets),
            currentKey: key,
            currentValue: null,
            hashValue: hash,
            probeSequence: [...probeSequence],
            description: `比较位置 ${index} 的键: ${bucket.items[0].key}`,
            operation: 'search',
            loadFactor: calculateLoadFactor(buckets),
          };

          if (bucket.items[0].key === key) {
            bucket.items[0].highlight = 'found';
            yield {
              buckets: cloneBuckets(buckets),
              currentKey: key,
              currentValue: bucket.items[0].value,
              hashValue: hash,
              probeSequence: [...probeSequence],
              description: `找到键 "${key}"，值 = ${bucket.items[0].value}`,
              operation: 'search',
              loadFactor: calculateLoadFactor(buckets),
            };
            bucket.items[0].highlight = undefined;
            bucket.highlight = undefined;
            return;
          }

          bucket.items[0].highlight = undefined;
          bucket.highlight = undefined;
          probes++;
        }

        yield {
          buckets: cloneBuckets(buckets),
          currentKey: key,
          currentValue: null,
          hashValue: hash,
          probeSequence: probeSequence,
          description: `未找到键 "${key}"`,
          operation: 'search',
          loadFactor: calculateLoadFactor(buckets),
        };
      }
    }

    function collectSteps(gen) {
      const steps = [];
      let result = gen.next();
      while (!result.done) {
        steps.push(result.value);
        result = gen.next();
      }
      return steps;
    }

    // ============================================
    // 状态与渲染
    // ============================================

    const methodNames = {
      chaining: '链地址法',
      linear: '线性探测',
      quadratic: '二次探测',
    };

    const gridEl = document.getElementById('grid');
    const stepInfoEl = document.getElementById('stepInfo');
    const descEl = document.getElementById('description');
    const infoKeyEl = document.getElementById('infoKey');
    const infoKeyValEl = document.getElementById('infoKeyVal');
    const infoHashEl = document.getElementById('infoHash');
    const infoHashValEl = document.getElementById('infoHashVal');
    const infoProbeEl = document.getElementById('infoProbe');
    const infoProbeValEl = document.getElementById('infoProbeVal');
    const infoLoadEl = document.getElementById('infoLoad');
    const infoMethodEl = document.getElementById('infoMethod');
    const infoCapacityEl = document.getElementById('infoCapacity');
    const infoCountEl = document.getElementById('infoCount');
    const btnInsert = document.getElementById('btnInsert');
    const btnSearch = document.getElementById('btnSearch');
    const btnPlay = document.getElementById('btnPlay');
    const btnStep = document.getElementById('btnStep');
    const btnReset = document.getElementById('btnReset');

    let buckets = [];
    let currentKey = null;
    let hashValue = null;
    let probeSequence = [];
    let description = '';
    let loadFactor = 0;
    let isPlaying = false;
    let currentStep = 0;
    let totalSteps = 0;
    let steps = [];
    let timer = null;

    // 预填充数据（与 React 组件初始化逻辑一致）
    function buildInitialBuckets() {
      const newBuckets = createEmptyBuckets(size);
      for (const item of items) {
        const hash = hashFunction(item.key, size);
        if (method === 'chaining') {
          newBuckets[hash].items.push({ key: item.key, value: item.value });
        } else {
          // 开放寻址法：简单线性探测
          let idx = hash;
          while (newBuckets[idx].items.length > 0) {
            idx = (idx + 1) % size;
          }
          newBuckets[idx].items.push({ key: item.key, value: item.value });
        }
      }
      return newBuckets;
    }

    function getBucketColor(bucket) {
      if (bucket.highlight === 'current') return '#22c55e';
      if (bucket.highlight === 'probing') return '#eab308';
      return 'var(--bg-tertiary)';
    }

    function getItemColor(item) {
      if (item.highlight === 'found') return '#22c55e';
      if (item.highlight === 'comparing') return '#3b82f6';
      if (item.highlight === 'collision') return '#ef4444';
      if (item.highlight === 'current') return '#22c55e';
      return '';
    }

    function renderBuckets() {
      gridEl.innerHTML = '';
      buckets.forEach((bucket, idx) => {
        const bucketEl = document.createElement('div');
        const classes = ['hashtable-bucket'];
        if (bucket.items.length > 0) classes.push('occupied');
        if (bucket.highlight) classes.push('highlighted');
        bucketEl.className = classes.join(' ');
        bucketEl.style.backgroundColor = getBucketColor(bucket);

        const indexEl = document.createElement('div');
        indexEl.className = 'bucket-index';
        indexEl.textContent = idx;
        bucketEl.appendChild(indexEl);

        const itemsEl = document.createElement('div');
        itemsEl.className = 'bucket-items';

        if (bucket.items.length === 0) {
          const emptyEl = document.createElement('div');
          emptyEl.className = 'bucket-empty';
          emptyEl.textContent = '空';
          itemsEl.appendChild(emptyEl);
        } else {
          bucket.items.forEach((item) => {
            const itemEl = document.createElement('div');
            itemEl.className = 'bucket-item';
            const color = getItemColor(item);
            if (color) itemEl.style.backgroundColor = color;

            const keyEl = document.createElement('span');
            keyEl.className = 'item-key';
            keyEl.textContent = item.key;

            const valueEl = document.createElement('span');
            valueEl.className = 'item-value';
            valueEl.textContent = ': ' + item.value;

            itemEl.appendChild(keyEl);
            itemEl.appendChild(valueEl);
            itemsEl.appendChild(itemEl);
          });
        }

        bucketEl.appendChild(itemsEl);
        gridEl.appendChild(bucketEl);
      });
    }

    function render() {
      renderBuckets();

      stepInfoEl.textContent = `步骤: ${currentStep} / ${totalSteps}`;

      // 信息栏
      if (currentKey) {
        infoKeyEl.style.display = '';
        infoKeyValEl.textContent = currentKey;
      } else {
        infoKeyEl.style.display = 'none';
      }

      if (hashValue !== null) {
        infoHashEl.style.display = '';
        infoHashValEl.textContent = hashValue;
      } else {
        infoHashEl.style.display = 'none';
      }

      if (probeSequence.length > 0) {
        infoProbeEl.style.display = '';
        infoProbeValEl.textContent = `[${probeSequence.join(', ')}]`;
      } else {
        infoProbeEl.style.display = 'none';
      }

      infoLoadEl.textContent = loadFactor.toFixed(2);

      // 描述
      if (description) {
        descEl.style.display = '';
        descEl.textContent = description;
      } else {
        descEl.style.display = 'none';
      }

      // 底部信息
      infoMethodEl.textContent = `方法: ${methodNames[method] || method}`;
      infoCapacityEl.textContent = `容量: ${size}`;
      infoCountEl.textContent = `元素数: ${buckets.reduce((sum, b) => sum + b.items.length, 0)}`;

      updateButtons();
    }

    function updateButtons() {
      btnInsert.disabled = isPlaying;
      btnSearch.disabled = isPlaying;
      btnPlay.disabled = totalSteps === 0;
      btnPlay.textContent = isPlaying ? '⏸ 暂停' : '▶ 播放';
      btnStep.disabled = isPlaying || currentStep >= totalSteps;
    }

    function notify(status) {
      if (PluginRuntime.updateState) {
        PluginRuntime.updateState({ status, currentStep, totalSteps });
      }
    }

    function stopPlay() {
      isPlaying = false;
      if (timer) { clearTimeout(timer); timer = null; }
      updateButtons();
    }

    function step() {
      if (currentStep >= totalSteps) return;
      const stepData = steps[currentStep];
      buckets = cloneBuckets(stepData.buckets);
      currentKey = stepData.currentKey;
      hashValue = stepData.hashValue;
      probeSequence = stepData.probeSequence;
      description = stepData.description;
      loadFactor = stepData.loadFactor;
      currentStep++;

      render();

      if (currentStep >= totalSteps) {
        stopPlay();
        notify('completed');
      } else {
        notify(isPlaying ? 'playing' : 'paused');
      }
    }

    function loop() {
      if (!isPlaying) return;
      timer = setTimeout(() => {
        if (!isPlaying) return;
        step();
        if (currentStep < totalSteps) loop();
      }, speed);
    }

    function play() {
      if (currentStep >= totalSteps) return;
      isPlaying = true;
      updateButtons();
      notify('playing');
      loop();
    }

    function pause() {
      stopPlay();
      notify('paused');
    }

    function generateSteps(operation, key, value) {
      const bucketsCopy = cloneBuckets(buckets);
      const actualKey = key || insertKey || `key${Math.floor(Math.random() * 100)}`;
      const actualValue = (value !== undefined && value !== null) ? value : (insertValue !== undefined && insertValue !== null ? insertValue : Math.floor(Math.random() * 100));

      let generator;
      if (operation === 'insert') {
        if (method === 'chaining') {
          generator = insertChaining(bucketsCopy, actualKey, actualValue);
        } else if (method === 'linear') {
          generator = insertLinear(bucketsCopy, actualKey, actualValue);
        } else {
          generator = insertQuadratic(bucketsCopy, actualKey, actualValue);
        }
      } else if (operation === 'search') {
        generator = searchHash(bucketsCopy, actualKey, method);
      } else {
        return null;
      }

      return collectSteps(generator);
    }

    function handleInsert() {
      const newSteps = generateSteps('insert');
      if (!newSteps) return;
      steps = newSteps;
      totalSteps = steps.length;
      currentStep = 0;
      isPlaying = true;
      updateButtons();
      notify('playing');
      loop();
    }

    function handleSearch() {
      const key = searchKey || (items.length ? items[Math.floor(Math.random() * items.length)].key : 'apple');
      const newSteps = generateSteps('search', key);
      if (!newSteps) return;
      steps = newSteps;
      totalSteps = steps.length;
      currentStep = 0;
      isPlaying = true;
      updateButtons();
      notify('playing');
      loop();
    }

    function reset() {
      stopPlay();
      steps = [];
      totalSteps = 0;
      currentStep = 0;
      buckets = buildInitialBuckets();
      currentKey = null;
      hashValue = null;
      probeSequence = [];
      description = '';
      loadFactor = calculateLoadFactor(buckets);
      render();
      notify('idle');
    }

    btnInsert.addEventListener('click', handleInsert);
    btnSearch.addEventListener('click', handleSearch);
    btnPlay.addEventListener('click', () => {
      if (isPlaying) pause();
      else play();
    });
    btnStep.addEventListener('click', () => {
      if (isPlaying) return;
      step();
    });
    btnReset.addEventListener('click', reset);

    // 参数变化时宿主会重新注入 iframe，无需额外处理
    window.onArgsUpdate = function () {};

    // 初始化
    buckets = buildInitialBuckets();
    loadFactor = calculateLoadFactor(buckets);
    render();
    notify('idle');
  </script>
</body>
</html>
